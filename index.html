<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランダムポケモン図鑑</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ポケモン図鑑</h1>
        <p class="subtitle">クリックでランダムなポケモンを見るわ</p>

        <div id="card" class="pokemon-card" role="button" tabindex="0" aria-label="クリックしてランダムなポケモンを表示">
            <div id="loading" class="loading hidden">
                <div class="pokeball">
                    <div class="pokeball-top"></div>
                    <div class="pokeball-middle"></div>
                    <div class="pokeball-bottom"></div>
                </div>
            </div>

            <div id="pokemon-info" class="pokemon-info hidden">
                <div class="pokemon-number" id="pokemon-number">#001</div>
                <img id="pokemon-image" class="pokemon-image" src="" alt="">
                <h2 id="pokemon-name" class="pokemon-name"></h2>
                <div id="pokemon-types" class="pokemon-types"></div>
                <div class="stats">
                    <div class="stat-row" id="stat-hp"></div>
                    <div class="stat-row" id="stat-attack"></div>
                    <div class="stat-row" id="stat-defense"></div>
                    <div class="stat-row" id="stat-speed"></div>
                </div>
            </div>

            <div id="initial-message" class="initial-message">
                <div class="pokeball-large">
                    <div class="pokeball-top"></div>
                    <div class="pokeball-middle"></div>
                    <div class="pokeball-bottom"></div>
                </div>
                <p>タップして始めるわ！</p>
            </div>
        </div>

        <button id="catch-btn" class="catch-btn">ランダムに捕まえる！</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
