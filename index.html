<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストップウォッチ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ストップウォッチ</h1>

        <div class="display">
            <span id="time">00:00:00.00</span>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">開始</button>
            <button id="stopBtn" class="btn btn-secondary" disabled>停止</button>
            <button id="resetBtn" class="btn btn-danger">リセット</button>
            <button id="lapBtn" class="btn btn-info" disabled>ラップ</button>
        </div>

        <div class="laps">
            <h2>ラップタイム</h2>
            <ul id="lapList"></ul>
        </div>

    <script src="script.js"></script>
</body>
</html>
